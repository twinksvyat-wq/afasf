[package]
name = "fightcore"
version = "0.1.0"
edition = "2021"
description = "WHITEOUT FC — physics fighting game core (ragdoll, combat, AI, low-poly mesh generation)"

[lib]
name = "fightcore"
crate-type = ["staticlib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
opt-level = 1
